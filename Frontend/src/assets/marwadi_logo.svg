<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a896" />
      <stop offset="100%" stop-color="#008080" />
    </linearGradient>
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Shield Outer Silver Border -->
  <path d="M10 15 L90 15 C90 65 75 95 50 110 C25 95 10 65 10 15 Z" fill="url(#silverBorder)" />
  
  <!-- Shield Inner Teal -->
  <path d="M15 20 L85 20 C85 62 72 90 50 103 C28 90 15 62 15 20 Z" fill="url(#shieldBg)" />
  
  <!-- Stylized White "M" & "U" Geometric Emblem -->
  <!-- Top Roof Wings -->
  <polygon points="50,42 28,28 34,24 50,35 66,24 72,28" fill="#ffffff" />
  
  <!-- Middle & Bottom "M-U" Structure -->
  <path d="M30 46 L30 82 L70 82 L70 46 L62 46 L62 74 L50 62 L38 74 L38 46 Z" fill="#ffffff" />
  <path d="M43 56 L50 63 L57 56 L57 70 L43 70 Z" fill="#ffffff" />

  <!-- Typography: Marwadi University -->
  <!-- "Marwadi" -->
  <text x="110" y="58" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">Marwadi</text>
  
  <!-- "University" -->
  <text x="112" y="92" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="600" fill="#cbd5e1" letter-spacing="9">UNIVERSITY</text>
</svg>
